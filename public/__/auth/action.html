<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tracklet — Security Action</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
    body {
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      user-select: none;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .container {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: #0f172a;
      margin-bottom: 0.35rem;
    }
    p {
      font-size: 0.75rem;
      color: #64748b;
      line-height: 1.5;
    }
  </style>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const mode = params.get('mode');
      const oobCode = params.get('oobCode');
      const continueUrl = params.get('continueUrl');

      // 1. If continueUrl points to a specific host (e.g. localhost for development)
      let targetBase = 'https://tracklet-eight.vercel.app';
      if (continueUrl) {
        try {
          const parsed = new URL(continueUrl);
          if (parsed.hostname === 'localhost' || parsed.hostname === '127.0.0.1') {
            targetBase = `${parsed.protocol}//${parsed.host}`;
          }
        } catch (e) {
          // fallback to default
        }
      }

      // 2. Redirect seamlessly to Tracklet's in-app views
      if (mode === 'resetPassword' && oobCode) {
        window.location.replace(`${targetBase}/reset-password?oobCode=${encodeURIComponent(oobCode)}`);
      } else if (mode === 'verifyEmail' && oobCode) {
        window.location.replace(`${targetBase}/verify-email?oobCode=${encodeURIComponent(oobCode)}`);
      } else {
        window.location.replace(targetBase);
      }
    })();
  </script>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Connecting to Tracklet</h1>
    <p>Verifying secure authentication credentials and redirecting to your workspace...</p>
  </div>
</body>
</html>
