<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Approach 3: Two-Tier Clean Deck · Tracklet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            heading: ['Outfit', 'sans-serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full flex overflow-hidden font-sans text-slate-800 antialiased selection:bg-brand-100 selection:text-brand-700">

  <!-- Tracklet Left Sidebar -->
  <aside class="w-52 shrink-0 bg-slate-50 border-r border-slate-200/80 flex flex-col justify-between h-screen select-none text-slate-900 text-xs">
    <div class="flex flex-col">
      <div class="h-13 px-3.5 py-3 flex items-center justify-between border-b border-slate-200/80">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-slate-900 flex items-center justify-center text-white font-heading font-bold text-sm">T</div>
          <span class="font-heading font-bold text-sm tracking-tight text-slate-900">Tracklet</span>
        </div>
      </div>
      <nav class="p-2 space-y-1">
        <a href="#applications" class="flex items-center justify-between px-3 py-2 rounded-lg font-semibold bg-white text-slate-900 border border-slate-200/80 shadow-2xs">
          <div class="flex items-center gap-2.5">
            <svg class="w-4 h-4 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
            <span>Applications</span>
          </div>
          <span class="px-1.5 py-0.2 rounded-full bg-brand-50 text-brand-700 font-mono text-[10px] font-bold">5</span>
        </a>
        <a href="#contacts" class="flex items-center gap-2.5 px-3 py-2 rounded-lg font-medium text-slate-600 hover:text-slate-900">
          <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          <span>Contacts</span>
        </a>
      </nav>
    </div>
    <div class="p-3 border-t border-slate-200/80 text-xs font-semibold text-slate-700">Saleem (Pro)</div>
  </aside>

  <!-- Workspace Container -->
  <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
    
    <!-- Tier 1: Search + Switcher + Primary Add CTA (40px) -->
    <header class="h-12 bg-white border-b border-slate-200/80 px-4 sm:px-6 flex items-center justify-between gap-3 shrink-0 z-30 text-xs">
      <div class="relative w-64">
        <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input 
          type="text" 
          placeholder="Search jobs... (⌘K)" 
          class="w-full pl-8 pr-4 py-1 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none"
        />
      </div>

      <div class="flex items-center gap-3">
        <!-- SegmentedTabs -->
        <div class="flex items-center bg-slate-100 p-0.5 rounded-lg border border-slate-200/80 text-xs font-medium">
          <button class="px-3 py-1 rounded-md font-semibold text-slate-900 bg-white shadow-xs">Board</button>
          <button class="px-3 py-1 rounded-md text-slate-600 hover:text-slate-900">Table</button>
        </div>

        <button class="px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-lg shadow-xs transition-colors">
          + Add Job
        </button>
      </div>
    </header>

    <!-- Tier 2: Dedicated Full-Width Filter Deck (36px) -->
    <div class="bg-slate-50/90 border-b border-slate-200/80 px-4 sm:px-6 py-1.5 flex items-center justify-between gap-3 text-xs shrink-0 overflow-x-auto">
      <div class="flex items-center gap-2 shrink-0">
        <span class="font-mono text-slate-400 text-[11px] uppercase tracking-wider mr-1">Filter:</span>
        <select class="text-xs bg-white border border-slate-200 rounded-md px-2 py-1 font-medium text-slate-700">
          <option>Status: Active (5)</option>
          <option>Status: All (8)</option>
          <option>Status: Archived (2)</option>
        </select>
        <select class="text-xs bg-white border border-slate-200 rounded-md px-2 py-1 font-medium text-slate-700">
          <option>Platform: All</option>
          <option>LinkedIn</option>
          <option>Indeed</option>
          <option>Greenhouse</option>
        </select>
        <select class="text-xs bg-white border border-slate-200 rounded-md px-2 py-1 font-medium text-slate-700">
          <option>Work: All</option>
          <option>Remote</option>
          <option>Hybrid</option>
        </select>
        <select class="text-xs bg-white border border-slate-200 rounded-md px-2 py-1 font-medium text-slate-700">
          <option>Job Type: All</option>
          <option>Full-time</option>
          <option>Contract</option>
        </select>
        <select class="text-xs bg-white border border-slate-200 rounded-md px-2 py-1 font-medium text-slate-700">
          <option>Date: All time</option>
          <option>Last 7 days</option>
          <option>This month</option>
        </select>
      </div>

      <div class="flex items-center gap-3 shrink-0">
        <span class="font-mono text-[11px] text-slate-500">5 active items</span>
        <button class="text-[11px] text-rose-600 hover:underline">Reset</button>
      </div>
    </div>

    <!-- Canvas -->
    <main class="flex-1 min-h-0 overflow-hidden relative p-4 sm:p-6">
      <div class="h-full flex overflow-x-auto gap-4 min-h-0">
        <div class="w-72 shrink-0 bg-slate-100/70 border border-slate-200 rounded-xl p-3 text-xs font-semibold text-slate-700">Saved (2)</div>
        <div class="w-72 shrink-0 bg-slate-100/70 border border-slate-200 rounded-xl p-3 text-xs font-semibold text-slate-700">Applied (1)</div>
        <div class="w-72 shrink-0 bg-slate-100/70 border border-slate-200 rounded-xl p-3 text-xs font-semibold text-slate-700">Screening (1)</div>
        <div class="w-72 shrink-0 bg-slate-100/70 border border-slate-200 rounded-xl p-3 text-xs font-semibold text-slate-700">Interview (1)</div>
        <div class="w-72 shrink-0 bg-slate-100/70 border border-slate-200 rounded-xl p-3 text-xs font-semibold text-slate-700">Offer (1)</div>
      </div>
    </main>

  </div>

</body>
</html>
