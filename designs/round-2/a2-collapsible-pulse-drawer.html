<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Variation A2: Collapsible Pulse Drawer · Tracklet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            heading: ['Outfit', 'sans-serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full flex overflow-hidden font-sans text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-700">

  <!-- Tracklet Left Sidebar -->
  <aside class="w-52 shrink-0 bg-slate-50 border-r border-slate-200/80 flex flex-col justify-between h-screen select-none text-slate-900 text-xs">
    <div class="flex flex-col">
      <div class="h-13 px-3.5 py-3 flex items-center justify-between border-b border-slate-200/80">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-slate-900 flex items-center justify-center text-white font-heading font-bold text-sm">T</div>
          <span class="font-heading font-bold text-sm tracking-tight text-slate-900">Tracklet</span>
        </div>
      </div>
      <nav class="p-2 space-y-1">
        <a href="#applications" class="flex items-center justify-between px-3 py-2 rounded-lg font-semibold bg-white text-slate-900 border border-slate-200/80 shadow-2xs">
          <div class="flex items-center gap-2.5">
            <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
            <span>Applications</span>
          </div>
          <span class="px-1.5 py-0.2 rounded-full bg-indigo-50 text-indigo-700 font-mono text-[10px] font-bold">6</span>
        </a>
        <a href="#contacts" class="flex items-center gap-2.5 px-3 py-2 rounded-lg font-medium text-slate-600 hover:text-slate-900">
          <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          <span>Contacts</span>
        </a>
        <a href="#analytics" class="flex items-center gap-2.5 px-3 py-2 rounded-lg font-medium text-slate-600 hover:text-slate-900">
          <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          <span>Analytics</span>
        </a>
      </nav>
    </div>
    <div class="p-3 border-t border-slate-200/80 text-xs font-semibold text-slate-700">Saleem (Pro)</div>
  </aside>

  <!-- Workspace Container -->
  <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
    
    <!-- Single-Row Command Toolbar -->
    <div class="sticky top-0 z-20 bg-white/95 backdrop-blur-md border-b border-slate-200/80 px-4 sm:px-6 py-2.5 shrink-0 flex items-center justify-between gap-3 shadow-2xs">
      
      <!-- Left: Search, Filter, and Expandable Pulse Pill -->
      <div class="flex items-center gap-2.5">
        <div class="relative w-56 sm:w-64">
          <input 
            type="text" 
            placeholder="Search applications..." 
            class="w-full pl-8 pr-4 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none"
          />
          <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>

        <select class="text-xs font-medium bg-slate-50 text-slate-700 border border-slate-200 rounded-lg px-2.5 py-1.5">
          <option>Status: Active (6)</option>
          <option>Status: All (18)</option>
        </select>

        <!-- VARIATION A2 SIGNATURE: Expandable Pulse Pill Toggle -->
        <button 
          id="pulse-toggle-btn"
          onclick="togglePulseDrawer()"
          class="hidden md:inline-flex items-center gap-1.5 px-2.5 py-1.5 bg-indigo-50/80 hover:bg-indigo-100 text-indigo-700 text-xs font-medium rounded-lg border border-indigo-200/60 transition-colors cursor-pointer"
        >
          <span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>
          <span>2 upcoming events</span>
          <svg id="pulse-chevron" class="w-3 h-3 text-indigo-500 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
      </div>

      <!-- Right: SegmentedTabs + Add Job -->
      <div class="flex items-center gap-3">
        <div class="flex items-center bg-slate-100 p-1 rounded-lg border border-slate-200/80 text-xs font-medium">
          <button class="px-3 py-1 rounded-md font-semibold text-slate-900 bg-white shadow-xs">Board</button>
          <button class="px-3 py-1 rounded-md text-slate-600 hover:text-slate-900">Table</button>
        </div>
        <button class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg shadow-xs transition-colors">
          + Add Job
        </button>
      </div>
    </div>

    <!-- VARIATION A2 SIGNATURE: Collapsible Pulse Drawer (Hidden by default, slides down smoothly) -->
    <div id="pulse-drawer" class="hidden bg-slate-900 text-white px-4 sm:px-6 py-2 border-b border-slate-800 transition-all duration-200 text-xs flex items-center justify-between gap-4">
      <div class="flex items-center gap-4 overflow-x-auto">
        <span class="font-mono text-slate-400 text-[11px] uppercase tracking-wider">Upcoming:</span>
        <div class="flex items-center gap-2 bg-slate-800/80 px-2.5 py-1 rounded-md cursor-pointer hover:bg-slate-700">
          <span class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>
          <span class="font-medium text-slate-200">Airbnb Tech Panel</span>
          <span class="text-slate-400 font-mono text-[11px]">Fri 10:00 AM</span>
        </div>
        <div class="flex items-center gap-2 bg-slate-800/80 px-2.5 py-1 rounded-md cursor-pointer hover:bg-slate-700">
          <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
          <span class="font-medium text-slate-200">Stripe Recruiter Call</span>
          <span class="text-slate-400 font-mono text-[11px]">Tomorrow 2:00 PM</span>
        </div>
        <div class="flex items-center gap-2 bg-slate-800/80 px-2.5 py-1 rounded-md cursor-pointer hover:bg-slate-700">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          <span class="font-medium text-slate-200">Vercel Written Offer</span>
          <span class="text-emerald-400 font-mono text-[11px]">Nov 20 deadline</span>
        </div>
      </div>
      <button onclick="togglePulseDrawer()" class="text-slate-400 hover:text-white text-xs">✕ Close</button>
    </div>

    <!-- Main Canvas -->
    <main class="flex-1 min-h-0 overflow-hidden relative p-4 sm:p-6">
      <div class="h-full flex overflow-x-auto gap-4 min-h-0">
        <div class="w-72 shrink-0 bg-slate-100/70 border border-slate-200 rounded-xl p-3 text-xs font-semibold text-slate-700">Saved (2)</div>
        <div class="w-72 shrink-0 bg-slate-100/70 border border-slate-200 rounded-xl p-3 text-xs font-semibold text-slate-700">Applied (1)</div>
        <div class="w-72 shrink-0 bg-slate-100/70 border border-slate-200 rounded-xl p-3 text-xs font-semibold text-slate-700">Screening (1)</div>
        <div class="w-72 shrink-0 bg-slate-100/70 border border-slate-200 rounded-xl p-3 text-xs font-semibold text-slate-700">Interview (1)</div>
        <div class="w-72 shrink-0 bg-slate-100/70 border border-slate-200 rounded-xl p-3 text-xs font-semibold text-slate-700">Offer (1)</div>
      </div>
    </main>

  </div>

  <script>
    let isPulseOpen = false;
    function togglePulseDrawer() {
      isPulseOpen = !isPulseOpen;
      const drawer = document.getElementById('pulse-drawer');
      const chevron = document.getElementById('pulse-chevron');
      if (isPulseOpen) {
        drawer.classList.remove('hidden');
        chevron.style.transform = 'rotate(180deg)';
      } else {
        drawer.classList.add('hidden');
        chevron.style.transform = 'rotate(0deg)';
      }
    }
  </script>
</body>
</html>
