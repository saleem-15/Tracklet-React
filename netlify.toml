# Netlify Configuration for Tracklet
# High-clarity Job Application Tracker

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "api"
  node_bundler = "esbuild"

# 1. Serverless Functions API route rewrite
# Proxies /api/* to /.netlify/functions/* preserving paths and query strings
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 2. Client-side Single Page Application (SPA) routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 3. Universal Security Headers (matches and extends prior vercel.json headers)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# 4. Long-term immutable caching for Vite build assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 5. Packaged Chrome Extension distribution zip
[[headers]]
  for = "/tracklet-extension.zip"
  [headers.values]
    Content-Type = "application/zip"
    Cache-Control = "public, max-age=0, must-revalidate"
