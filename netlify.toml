# Netlify Configuration for Tracklet
# Cloud-native Freemium/Pro SaaS on Cloudflare Pages (tracklet.pages.dev)
# Netlify routes client requests to SPA shell where LegacyMigrationScreen prompts the permanent move

[build]
  command = "npm run build"
  publish = "dist"

# 1. API routes 308 Permanent Redirect (preserves HTTP method & request body for extensions/clients)
[[redirects]]
  from = "/api/*"
  to = "https://tracklet.pages.dev/api/:splat"
  status = 308
  force = true

# 2. SPA client route fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 3. Universal Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
